name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged commit
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Neovim
        uses: https://github.com/rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: stable

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Run smoke tests
        run: nvim --headless -u NONE -l tests/smoke.lua

      - name: Build release archive
        run: mkdir -p dist && git archive --format=tar.gz --output=\"dist/${REPO_NAME}-${REF_NAME}.tar.gz\" HEAD
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REF_NAME: ${{ github.ref_name }}

      - name: Create GitHub release
        uses: https://code.forgejo.org/actions/forgejo-release@v2.13.4
        with:
          release-dir: dist
          direction: upload
          generate_release_notes: true
          release-notes-assistant: true
          prerelease: ${{ contains(github.ref_name, '-') }}
