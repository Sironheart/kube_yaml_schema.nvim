name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  stylua:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: https://code.forgejo.org/actions/checkout@v6

      - name: Check Lua formatting
        run: |
          npx @johnnymorganz/stylua-bin --check .

  selene:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: https://code.forgejo.org/actions/checkout@v6

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: https://github.com/Swatinem/rust-cache@v2

      - name: Install Selene
        run: cargo install --locked selene

      - name: Run Selene
        run: selene lua tests plugin

  smoke:
    name: Smoke (Neovim ${{ matrix.neovim-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim-version:
          - stable
          - nightly
    steps:
      - name: Check out repository
        uses: https://code.forgejo.org/actions/checkout@v6

      - name: Install Neovim
        uses: https://github.com/rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim-version }}

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Run smoke tests
        run: nvim --headless -u NONE -l tests/smoke.lua
